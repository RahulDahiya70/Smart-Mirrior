<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrainMate Pro 🚆</title>

  <style>
    :root {
      --primary: #8A2BE2;
      --secondary: #FFBF00;
      --bg: #121212;
      --card: #1e1e1e;
      --text: #ffffff;
      --muted: #aaaaaa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 250px;
      background: #0d0d0d;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .sidebar h2 {
      color: var(--primary);
      margin-bottom: 10px;
    }

    .room {
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      background: #1a1a1a;
      transition: 0.3s;
    }

    .room:hover,
    .room.active {
      background: var(--primary);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 15px;
      background: #1a1a1a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #181818;
    }

    .msg {
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      max-width: 70%;
      word-wrap: break-word;
    }

    .me {
      background: var(--primary);
      margin-left: auto;
    }

    .other {
      background: #333;
    }

    .meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 5px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      gap: 10px;
      background: #1a1a1a;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px 15px;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .emoji-panel {
      display: none;
      padding: 10px;
      background: #222;
    }

    .emoji-panel button {
      font-size: 20px;
      margin: 3px;
      background: #333;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-box {
      background: var(--card);
      padding: 25px;
      border-radius: 15px;
      width: 320px;
    }

    .modal-box h3 {
      margin-bottom: 15px;
      color: var(--secondary);
    }

    .modal-box input {
      width: 100%;
      margin-bottom: 12px;
    }

    @media (max-width: 700px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
      }

      .room {
        min-width: 120px;
        text-align: center;
      }

      .msg {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <h2>TrainMate 🚆</h2>
    <div class="room active" onclick="switchRoom('general', this)">General</div>
    <div class="room" onclick="switchRoom('train', this)">Train Status</div>
    <div class="room" onclick="switchRoom('emergency', this)">Emergency</div>
    <div class="room" onclick="switchRoom('food', this)">Food</div>
  </div>

  <div class="main">
    <div class="header">
      <h3 id="room-name">General Chat</h3>
      <div>
        <button onclick="toggleEmoji()">😊</button>
        <button onclick="clearChat()">Clear</button>
      </div>
    </div>

    <div id="chat-box" class="chat-box"></div>

    <div id="emoji" class="emoji-panel">
      <button onclick="addEmoji('😀')">😀</button>
      <button onclick="addEmoji('😂')">😂</button>
      <button onclick="addEmoji('🚆')">🚆</button>
      <button onclick="addEmoji('🔥')">🔥</button>
      <button onclick="addEmoji('🙏')">🙏</button>
    </div>

    <div class="input-area">
      <input id="msg" type="text" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-box">
      <h3>Enter Details</h3>
      <input id="name" type="text" placeholder="Your Name" />
      <input id="train" type="text" placeholder="Train Number" />
      <button onclick="saveUser()">Start Chat</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = typeof io !== "undefined" ? io() : null;

    let username = "";
    let trainNumber = "";
    let currentRoom = "general";

    const chatBox = document.getElementById("chat-box");
    const messageInput = document.getElementById("msg");

    function saveUser() {
      username = document.getElementById("name").value.trim() || "Guest";
      trainNumber = document.getElementById("train").value.trim() || "Unknown";

      document.getElementById("modal").style.display = "none";

      if (socket) {
        socket.emit("joinRoom", {
          user: username,
          train: trainNumber,
          room: currentRoom
        });
      }

      addMessage(`Welcome ${username}! You joined ${currentRoom} chat.`, "other");
    }

    function addMessage(message, type) {
      const div = document.createElement("div");
      div.className = `msg ${type}`;

      div.innerHTML = `
        <div>${escapeHTML(message)}</div>
        <div class="meta">${new Date().toLocaleTimeString()}</div>
      `;

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
      const text = messageInput.value.trim();

      if (!text) return;

      addMessage(text, "me");

      if (socket) {
        socket.emit("chat", {
          user: username,
          train: trainNumber,
          msg: text,
          room: currentRoom
        });
      }

      messageInput.value = "";
    }

    function switchRoom(room, element) {
      currentRoom = room;

      document.getElementById("room-name").innerText =
        room.charAt(0).toUpperCase() + room.slice(1) + " Chat";

      chatBox.innerHTML = "";

      document.querySelectorAll(".room").forEach(item => {
        item.classList.remove("active");
      });

      element.classList.add("active");

      if (socket) {
        socket.emit("joinRoom", {
          user: username,
          train: trainNumber,
          room: currentRoom
        });
      }

      addMessage(`You switched to ${room} room.`, "other");
    }

    function toggleEmoji() {
      const emojiPanel = document.getElementById("emoji");
      emojiPanel.style.display =
        emojiPanel.style.display === "block" ? "none" : "block";
    }

    function addEmoji(emoji) {
      messageInput.value += emoji;
      messageInput.focus();
    }

    function clearChat() {
      chatBox.innerHTML = "";
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }

    messageInput.addEventListener("keypress", function (event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    messageInput.addEventListener("input", function () {
      if (socket && username) {
        socket.emit("typing", {
          user: username,
          room: currentRoom
        });
      }
    });

    if (socket) {
      socket.on("chat", function (data) {
        if (data.room === currentRoom && data.user !== username) {
          addMessage(`${data.user}: ${data.msg}`, "other");
        }
      });

      socket.on("typing", function (data) {
        console.log(`${data.user} is typing...`);
      });
    }
  </script>

</body>
</html>
